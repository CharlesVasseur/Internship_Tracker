# Runs the offline test suite on Windows, macOS and Linux for every push to main and every pull request.
#
# It runs pytest and nothing else: never the triage tool, no secrets, no contact address. The tests are
# offline (a guard in tests/conftest.py makes any real network call fail).
#
# The tests that need real saved pages skip themselves here, because tests/local_fixtures/ is not in the
# repository. The firm-name check in tests/test_repo_hygiene.py skips itself too, because survey_input.csv
# is not in the repository: run that one on your own machine.
#
# Runner images, Python versions and pytest (the version used on the author's machine) are pinned, so a new
# image or release cannot change a result unannounced.
# The two actions are pinned to a full commit hash (the tag is in the comment). Update them by hand.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12.8" }
          - { os: windows-2025, python: "3.12.8" }
          - { os: macos-15, python: "3.12.8" }
          - { os: ubuntu-24.04, python: "3.12.3" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest and openpyxl
        run: python -m pip install pytest==9.1.1 openpyxl==3.1.5

      - name: Show the versions in use
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -m pytest --version

      - name: Run the tests
        run: python -m pytest -q
