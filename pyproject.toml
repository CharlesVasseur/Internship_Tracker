[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.67.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracker = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
